name: Verify hosted Render deployment
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-hosted-render
  cancel-in-progress: true
jobs:
  hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - name: Verify hosted database, pages, assets and denied login
        run: |
          python - <<'PY'
          import json, re, time, urllib.request, urllib.error
          base = "https://foggara-dz.onrender.com"

          # Resolve the repository's single Alembic head without importing
          # project dependencies. This keeps hosted verification aligned with
          # future migrations and fails closed on divergent heads.
          import ast, pathlib
          revisions = {}
          parents = set()
          for path in pathlib.Path("app/backend/alembic/versions").glob("*.py"):
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              revision = None
              down_revision = None
              for node in tree.body:
                  if isinstance(node, (ast.Assign, ast.AnnAssign)):
                      targets = node.targets if isinstance(node, ast.Assign) else [node.target]
                      for target in targets:
                          if isinstance(target, ast.Name) and target.id in {"revision", "down_revision"}:
                              value = ast.literal_eval(node.value)
                              if target.id == "revision":
                                  revision = value
                              else:
                                  down_revision = value
              if revision:
                  revisions[revision] = str(path)
                  if isinstance(down_revision, str):
                      parents.add(down_revision)
                  elif isinstance(down_revision, (tuple, list)):
                      parents.update(x for x in down_revision if isinstance(x, str))
          heads = sorted(set(revisions) - parents)
          assert len(heads) == 1, f"Expected one Alembic head, got {heads}"
          expected_head = heads[0]
          print("Expected repository Alembic head:", expected_head)

          for attempt in range(90):
              try:
                  with urllib.request.urlopen(base + "/api/health", timeout=10) as response:
                      health = json.load(response)
                  assert health["db"] == "up"
                  assert health["alembic"] == expected_head, health
                  print("Hosted health:", health)
                  break
              except Exception as exc:
                  if attempt == 89:
                      raise
                  print("Awaiting healthy deployment:", type(exc).__name__)
                  time.sleep(5)
          for path in ("/", "/login", "/register", "/app", "/app/projects"):
              with urllib.request.urlopen(base + path, timeout=20) as response:
                  html = response.read().decode()
                  assert response.status == 200
                  assert '<div id="root">' in html
                  assert response.headers["X-Content-Type-Options"] == "nosniff"
                  assert "max-age" in response.headers["Strict-Transport-Security"]
                  assert "frame-ancestors 'none'" in response.headers["Content-Security-Policy"]
                  print("Page served:", path)
          asset = re.search(r'<script[^>]+src="([^"]+)"', html).group(1)
          with urllib.request.urlopen(base + asset, timeout=20) as response:
              assert response.status == 200 and len(response.read()) > 100
          protected = urllib.request.Request(base + "/api/projects")
          try:
              urllib.request.urlopen(protected, timeout=20)
              raise AssertionError("Unauthenticated project access was accepted")
          except urllib.error.HTTPError as exc:
              assert exc.code == 401, exc.code
          payload = json.dumps({"email": "deployment-probe@example.invalid", "password": "invalid-probe-password"}).encode()
          request = urllib.request.Request(base + "/api/auth/login", data=payload, headers={"Content-Type": "application/json"})
          try:
              urllib.request.urlopen(request, timeout=20)
              raise AssertionError("Invalid login was accepted")
          except urllib.error.HTTPError as exc:
              assert exc.code == 401, exc.code
              assert "no-store" in exc.headers["Cache-Control"]
          print("Protected API and invalid login correctly rejected; no live account or business record created.")
          PY
      - name: Verify public interactive release in Chromium
        run: python app/backend/tests/hosted_public_smoke.py
