name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Create databases
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c "CREATE DATABASE foggara;" -c "CREATE DATABASE foggara_test;"
      - name: Install backend dependencies
        working-directory: app/backend
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run migrations and seed
        working-directory: app/backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/foggara
          JWT_SECRET: ci-secret-0123456789abcdef0123456789abcdef
        run: |
          python -m alembic upgrade head
          python seed.py
      - name: Run tests
        working-directory: app/backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/foggara_test
          JWT_SECRET: ci-secret-0123456789abcdef0123456789abcdef
        run: python -m pytest tests/ -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install dependencies
        working-directory: app
        run: npm ci
      - name: Build
        working-directory: app
        run: npm run build
      - name: Lint
        working-directory: app
        run: npm run lint
