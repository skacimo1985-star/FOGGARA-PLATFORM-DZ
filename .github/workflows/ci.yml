name: Verify FOGGARA
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
concurrency:
  group: foggara-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  backend:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    # This job intentionally covers migrations, Rust build, full pytest,
    # frontend build, Chromium installation and browser smoke in one isolated DB run.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: foggara_migration
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install -r requirements.lock -r requirements-dev.txt
        working-directory: app/backend
      - name: Verify database guard without connecting to a database
        run: python -m unittest tests.test_database_safety -v
        working-directory: app/backend
      - run: python -m alembic upgrade head
        working-directory: app/backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/foggara_migration
      - name: Verify migration paths and SQL isolation
        working-directory: app/backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/foggara_migration
        run: python -m tests.migration_smoke
      - name: Install PostgreSQL 16 recovery clients
        run: |
          sudo apt-get update -qq && sudo apt-get install -y postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - name: Verify snapshot recovery, tenant isolation and concurrent HTTP admission
        working-directory: app/backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/foggara_migration
        run: python -m tests.operational_gates
      - name: Recreate isolated pytest database
        working-directory: app/backend
        env:
          POSTGRES_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
          TEST_DATABASE_NAME: foggara_test
        run: |
          python - <<'PY'
          import os
          import psycopg
          from psycopg import sql

          import re
          from urllib.parse import urlparse

          admin_url = os.environ["POSTGRES_ADMIN_URL"]
          db_name = os.environ["TEST_DATABASE_NAME"]
          parsed = urlparse(admin_url)

          if parsed.hostname not in {"localhost", "127.0.0.1"}:
              raise SystemExit(f"Refusing non-local PostgreSQL host: {parsed.hostname!r}")
          if not re.fullmatch(r"foggara_test(?:_[a-z0-9_]+)?", db_name):
              raise SystemExit(f"Refusing unsafe pytest database name: {db_name!r}")
          if parsed.path.rstrip("/") != "/postgres":
              raise SystemExit("Administrative connection must target the postgres database")

          with psycopg.connect(admin_url, autocommit=True) as conn:
              with conn.cursor() as cur:
                  cur.execute(
                      """
                      SELECT pg_terminate_backend(pid)
                      FROM pg_stat_activity
                      WHERE datname = %s AND pid <> pg_backend_pid()
                      """,
                      (db_name,),
                  )
                  cur.execute(sql.SQL("DROP DATABASE IF EXISTS {}").format(sql.Identifier(db_name)))
                  cur.execute(sql.SQL("CREATE DATABASE {}").format(sql.Identifier(db_name)))
          PY
      - name: Build real Rust comparison engine
        working-directory: app/engines/nexus-core
        run: cargo build --release --locked
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.18.0'
      - run: npm ci && npm run build
        working-directory: app
      - run: pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m tests.browser_smoke
        working-directory: app/backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/foggara_migration
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: foggara-browser-verification
          path: app/backend/qa
          retention-days: 14
      - name: Run backend tests with diagnostics
        working-directory: app/backend
        env:
          NEXUS_RUST_TEST_BINARY: ${{ github.workspace }}/app/engines/nexus-core/target/release/foggara-nexus-core
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/foggara_test
        run: |
          set -o pipefail
          mkdir -p test-results
          python -m pytest tests/ -q -ra --tb=short --junitxml=test-results/junit.xml \
            2>&1 | tee test-results/pytest.log
      - name: Upload backend test diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foggara-backend-test-diagnostics
          path: app/backend/test-results
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: foggara-operational-package
          path: |
            app/dist
            app/backend/app
            app/backend/alembic
            app/backend/alembic.ini
            app/backend/requirements.lock
            docs/OPERATIONS.md
          retention-days: 14
  security:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: pip install pip-audit==2.10.1 bandit==1.8.6
      - run: pip-audit -r app/backend/requirements.lock
      - run: bandit -q -r app/backend/app -ll
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
  rust:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - working-directory: app/engines/nexus-core
        run: cargo test --locked && cargo clippy --locked --all-targets -- -D warnings
  frontend:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.18.0'
      - run: npm ci && npm run build
        working-directory: app

      - run: npm run typecheck
        working-directory: app
      - run: npm run lint
        working-directory: app
      - run: npm test
        working-directory: app
      - name: Audit locked dependencies
        working-directory: app
        run: npm run audit:dependencies
  production-container:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POSTGRES_PASSWORD: ci-disposable-database-password
      DATABASE_URL: postgresql+psycopg://foggara:ci-disposable-database-password@db:5432/foggara
      JWT_SECRET: ci-disposable-secret-only-not-for-production-94821
      SETUP_KEY: ci-disposable-bootstrap-key-94821
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and start isolated production stack
        run: docker compose -f compose.production.yml up --build -d
      - name: Verify API health and persistent worker
        run: |
          python - <<'PY'
          import json, time, urllib.request, subprocess
          expected_head = subprocess.check_output(["docker", "compose", "-f", "compose.production.yml", "exec", "-T", "web", "python", "-m", "alembic", "heads"], text=True).split()[0]
          for attempt in range(40):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:8000/api/health", timeout=3) as response:
                      body = json.load(response)
                      assert body["db"] == "up"
                      assert body["alembic"] == expected_head
                      break
              except Exception:
                  if attempt == 39:
                      raise
                  time.sleep(2)
          PY
          docker compose -f compose.production.yml ps --status running --services | grep -x worker
      - name: Verify production login and module APIs
        run: python app/backend/tests/production_smoke.py
      - name: Show failure diagnostics
        if: failure()
        run: docker compose -f compose.production.yml logs --tail 80
      - name: Remove isolated CI containers
        if: always()
        run: docker compose -f compose.production.yml down -v
