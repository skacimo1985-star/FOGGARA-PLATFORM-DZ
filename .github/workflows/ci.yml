name: Verify FOGGARA
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: foggara_migration
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r requirements-dev.txt
        working-directory: app/backend
      - run: python -m alembic upgrade head
        working-directory: app/backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/foggara_migration
      - run: >-
          python -c "import psycopg; c = psycopg.connect('postgresql://postgres:postgres@localhost:5432/postgres', autocommit=True); c.execute('CREATE DATABASE foggara_test'); c.close()"
      - run: python -m pytest tests/ -q
        working-directory: app/backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/foggara_test
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - run: npm ci && npm run build
        working-directory: app
      - run: pip install playwright==1.55.0
      - run: python -m playwright install --with-deps chromium
      - run: python -m tests.browser_smoke
        working-directory: app/backend
        env:
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/foggara_migration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: foggara-browser-verification
          path: app/backend/qa
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: foggara-operational-package
          path: |
            app/dist
            app/backend/app
            app/backend/alembic
            app/backend/alembic.ini
            app/backend/requirements.txt
            docs/OPERATIONS.md
          retention-days: 14
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - run: npm ci && npm run build
        working-directory: app
