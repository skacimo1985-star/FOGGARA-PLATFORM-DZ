name: Self-hosted Windows Verify

on:
  push:
    branches:
      - "selfhosted-verify/**"
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Branch, tag, or commit SHA to verify"
        required: true
        default: "main"
        type: string
      require_rust:
        description: "Fail if Rust/cargo is not installed on the runner"
        required: true
        default: false
        type: boolean

concurrency:
  group: foggara-self-hosted-windows-${{ github.ref }}-${{ inputs.target_ref || 'push' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: windows-self-hosted
    if: github.event_name == 'workflow_dispatch' || github.actor == 'skacimo1985-star'
    runs-on: [self-hosted, Windows, X64, foggara-ci]
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      TEST_DATABASE_URL: "sqlite:///./foggara-selfhosted-ci.db"
      JWT_SECRET: "self-hosted-ci-disposable-secret-0123456789abcdef"
      ENV: "dev"
    steps:
      - name: Checkout trigger metadata
        if: github.event_name == 'push'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          clean: true

      - name: Resolve target ref
        id: target
        shell: powershell
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $target = "${{ inputs.target_ref }}"
          }
          else {
            $target = (Get-Content ".github/self-hosted-target.txt" -Raw).Trim()
          }

          if ([string]::IsNullOrWhiteSpace($target)) {
            throw "Self-hosted verification target ref is empty."
          }

          "ref=$target" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Verification target: $target"

      - name: Resolve verification suite
        id: suite
        shell: powershell
        run: |
          $suite = 'full'
          if (Test-Path '.github/self-hosted-suite.txt') {
            $candidate = (Get-Content '.github/self-hosted-suite.txt' -Raw).Trim().ToLowerInvariant()
            if ($candidate -in @('full', 'ogc', 'stac')) { $suite = $candidate }
            else { throw "Unsupported self-hosted verification suite: $candidate" }
          }
          "suite=$suite" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Verification suite: $suite"

      - name: Checkout requested ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.target.outputs.ref }}
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install backend and audit dependencies
        working-directory: app/backend
        shell: powershell
        run: |
          python -m pip install -r requirements.lock -r requirements-dev.txt
          python -m pip install pip-audit==2.10.1 bandit==1.8.6

      - name: Compile Python sources
        working-directory: app/backend
        shell: powershell
        run: |
          python -m compileall -q app seed.py tests/test_bootstrap.py tests/test_wilayas.py tests/test_agriculture_operations.py

      - name: Reject repository-stored demo credential
        shell: powershell
        run: |
          $literal = Get-ChildItem -Path app -Recurse -File |
            Select-String -SimpleMatch 'Demo#2026'
          if ($literal) {
            $literal | ForEach-Object { Write-Host $_ }
            throw "Hard-coded demo credential literal found in the working tree."
          }

          $pythonAssignments = Get-ChildItem -Path app/backend -Recurse -Filter *.py -File |
            Select-String -Pattern 'DEMO_PASSWORD\s*=\s*["'']'
          if ($pythonAssignments) {
            $pythonAssignments | ForEach-Object { Write-Host $_ }
            throw "Python source assigns a literal DEMO_PASSWORD."
          }

      - name: Audit backend dependencies
        working-directory: app/backend
        shell: powershell
        run: python -m pip_audit -r requirements.lock

      - name: Bandit backend scan
        working-directory: app/backend
        shell: powershell
        run: python -m bandit -q -r app -ll

      - name: Verify demo seed and agriculture paths on SQLite
        if: steps.suite.outputs.suite == 'full'
        working-directory: app/backend
        shell: powershell
        run: |
          @'
          def pytest_configure(config):
              import app.security as security
              # Test-only cost reduction for low-power self-hosted hardware.
              # Production source remains at 600,000 PBKDF2 iterations.
              security._PASSWORD_ITERATIONS = 120_000
          '@ | Set-Content -Path selfhosted_ci_plugin.py -Encoding UTF8

          python -m pytest -p selfhosted_ci_plugin tests/test_bootstrap.py tests/test_wilayas.py tests/test_agriculture_operations.py -q -ra --tb=short
          $testExit = $LASTEXITCODE
          Remove-Item selfhosted_ci_plugin.py -Force -ErrorAction SilentlyContinue
          if ($testExit -ne 0) { exit $testExit }

      - name: Verify OGC Features compatibility
        if: steps.suite.outputs.suite == 'ogc'
        working-directory: app/backend
        shell: powershell
        run: |
          python -m pytest tests/test_ogc_features.py -q -ra --tb=short

      - name: Verify STAC remote-sensing projection
        if: steps.suite.outputs.suite == 'stac'
        working-directory: app/backend
        shell: powershell
        run: |
          python -m pytest tests/test_stac.py -q -ra --tb=short

      - name: Set up Node 22
        if: steps.suite.outputs.suite == 'full'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"

      - name: Verify frontend
        if: steps.suite.outputs.suite == 'full'
        working-directory: app
        shell: powershell
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build
          npm audit --omit=dev --audit-level=high
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm audit --audit-level=high
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Rust engine when available
        if: steps.suite.outputs.suite == 'full'
        working-directory: app/engines/nexus-core
        shell: powershell
        run: |
          $cargo = Get-Command cargo -ErrorAction SilentlyContinue
          if (-not $cargo) {
            if ("${{ inputs.require_rust }}" -eq "true") {
              throw "Rust/cargo is required for this run but is not installed on the self-hosted runner."
            }
            Write-Warning "Rust/cargo is not installed; Rust verification skipped for this local runner."
            exit 0
          }

          cargo test --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verification summary
        if: always()
        shell: powershell
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '## FOGGARA self-hosted verification'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ('- Target: ' + '${{ steps.target.outputs.ref }}')
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '- Runner: Windows self-hosted X64'
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value '- PostgreSQL/Alembic recovery gates remain owned by the full Linux CI workflow.'

      - name: Remove disposable SQLite files
        if: always()
        working-directory: app/backend
        shell: powershell
        run: |
          Get-ChildItem -Path . -Filter 'foggara-selfhosted-ci.db*' -ErrorAction SilentlyContinue |
            Remove-Item -Force -ErrorAction SilentlyContinue
