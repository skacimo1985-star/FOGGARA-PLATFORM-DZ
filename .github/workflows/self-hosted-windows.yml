name: Self-hosted Windows Verify

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Branch, tag, or commit SHA to verify"
        required: true
        default: "main"
        type: string
      require_rust:
        description: "Fail if Rust/cargo is not installed on the runner"
        required: true
        default: false
        type: boolean

concurrency:
  group: foggara-self-hosted-windows-${{ inputs.target_ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: windows-self-hosted
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      TEST_DATABASE_URL: "sqlite:///./foggara-selfhosted-ci.db"
      JWT_SECRET: "self-hosted-ci-disposable-secret-0123456789abcdef"
      ENV: "dev"
    steps:
      - name: Checkout requested ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.target_ref }}
          persist-credentials: false
          clean: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install backend and audit dependencies
        working-directory: app/backend
        shell: pwsh
        run: |
          python -m pip install -r requirements.lock -r requirements-dev.txt
          python -m pip install pip-audit==2.10.1 bandit==1.8.6

      - name: Compile Python sources
        working-directory: app/backend
        shell: pwsh
        run: |
          python -m compileall -q app seed.py tests/test_bootstrap.py tests/test_wilayas.py tests/test_agriculture_operations.py

      - name: Reject repository-stored demo credential
        shell: pwsh
        run: |
          $literal = Get-ChildItem -Path app -Recurse -File |
            Select-String -SimpleMatch 'Demo#2026'
          if ($literal) {
            $literal | ForEach-Object { Write-Host $_ }
            throw "Hard-coded demo credential literal found in the working tree."
          }

          $pythonAssignments = Get-ChildItem -Path app/backend -Recurse -Filter *.py -File |
            Select-String -Pattern 'DEMO_PASSWORD\s*=\s*["'']'
          if ($pythonAssignments) {
            $pythonAssignments | ForEach-Object { Write-Host $_ }
            throw "Python source assigns a literal DEMO_PASSWORD."
          }

      - name: Audit backend dependencies
        working-directory: app/backend
        shell: pwsh
        run: python -m pip_audit -r requirements.lock

      - name: Bandit backend scan
        working-directory: app/backend
        shell: pwsh
        run: python -m bandit -q -r app -ll

      - name: Verify demo seed and agriculture paths on SQLite
        working-directory: app/backend
        shell: pwsh
        run: |
          python -m pytest tests/test_bootstrap.py tests/test_wilayas.py tests/test_agriculture_operations.py -q -ra --tb=short

      - name: Set up Node 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.18.0"

      - name: Verify frontend
        working-directory: app
        shell: pwsh
        run: |
          npm ci
          npm run typecheck
          npm run lint
          npm test
          npm run build
          node scripts/audit-dependencies.mjs

      - name: Verify Rust engine when available
        working-directory: app/engines/nexus-core
        shell: pwsh
        run: |
          $cargo = Get-Command cargo -ErrorAction SilentlyContinue
          if (-not $cargo) {
            if ("${{ inputs.require_rust }}" -eq "true") {
              throw "Rust/cargo is required for this run but is not installed on the self-hosted runner."
            }
            Write-Warning "Rust/cargo is not installed; Rust verification skipped for this local runner."
            exit 0
          }

          cargo test --locked
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clippy --locked --all-targets -- -D warnings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verification summary
        if: always()
        shell: pwsh
        run: |
          "## FOGGARA self-hosted verification" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- Target: `${{ inputs.target_ref }}`" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- Runner: `Windows self-hosted X64`" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- PostgreSQL/Alembic recovery gates remain owned by the full Linux CI workflow." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append

      - name: Remove disposable SQLite files
        if: always()
        working-directory: app/backend
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Filter 'foggara-selfhosted-ci.db*' -ErrorAction SilentlyContinue |
            Remove-Item -Force -ErrorAction SilentlyContinue
