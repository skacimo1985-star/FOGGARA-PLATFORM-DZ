services:
  - type: web
    name: foggara-dz
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: cd app && npm ci && node --test tests/visual-asset-integrity.test.mjs tests/no-stale-service-worker.test.mjs tests/farm-landing.test.mjs tests/gis-operational-workspace.test.mjs tests/parcel-boundary-workspace.test.mjs tests/gis-direct-workflow.test.mjs tests/gis-polygon-intelligence.test.mjs && npm run build && test -s dist/images/user-oasis-hero.webp && test -s dist/images/oasis-dawn.webp && test -s dist/images/oasis-hero.webp && test -s dist/expo-qr.svg && python -m compileall -q backend/app && pip install -r backend/requirements.lock
    startCommand: cd app/backend && python -m alembic upgrade head && python seed_reference.py && { [ "${SEED_DEMO:-false}" != "true" ] || python seed.py; } && exec python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-proxy-headers
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: NODE_VERSION
        value: 22.18.0
      - key: ENV
        value: prod
      - key: SEED_DEMO
        value: "false"
      - key: DEMO_INSTANCE
        value: "true"
      - key: DEMO_PASSWORD
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: SETUP_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: TRUST_PROXY_HEADERS
        value: "false"
      - key: NEXUS_MATRIX_ENGINE
        value: python
      - key: OPERATIONS_AUTOMATION_ENABLED
        value: "true"
      - key: FIELD_AUTOMATION_ENABLED
        value: "true"
      - key: FIELD_AUTOMATION_INTERVAL_SECONDS
        value: "21600"
      - key: FIELD_AUTOMATION_LOOKBACK_DAYS
        value: "45"
      - key: FIELD_AUTOMATION_CLOUD_COVER_LTE
        value: "35"
      - key: FIELD_AUTOMATION_BATCH_SIZE
        value: "12"
      - key: TOKEN_TTL_HOURS
        value: "2"
      - key: TRUSTED_PROXY_PEERS
        value: ""
