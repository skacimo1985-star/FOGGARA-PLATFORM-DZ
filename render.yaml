services:
  - type: web
    name: foggara-dz
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: cd app && npm ci && npm run build && python -m compileall -q backend/app && pip install -r backend/requirements.lock
    startCommand: cd app/backend && python -m alembic upgrade head && python seed.py && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-proxy-headers
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: NODE_VERSION
        value: 22.18.0
      - key: ENV
        value: prod
      - key: SEED_DEMO
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: SETUP_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: TRUST_PROXY_HEADERS
        value: "false"
      - key: NEXUS_MATRIX_ENGINE
        value: python
      - key: TOKEN_TTL_HOURS
        value: "2"
      - key: TRUSTED_PROXY_PEERS
        value: ""
